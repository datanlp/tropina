name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck, unit, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Production build: no TEST records, data validated by `prebuild`.
      - run: npm run build

  e2e:
    name: E2E + axe (desktop and mobile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Builds with TEST records and starts the server (see playwright.config.ts).
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  preview:
    name: Preview screenshots and Lighthouse (LOREM data, real map tiles)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx cross-env TROPINA_INCLUDE_PLACEHOLDER_DATA=1 npm run build
      - run: |
          npx next start -p 3100 &
          npx wait-on http://localhost:3100/en/poland/christmas-markets
          node scripts/screenshots.mjs
          npm run lighthouse
        env:
          LIGHTHOUSE_PAGES: /en/poland/christmas-markets,/ru/poland/christmas-markets,/en/poland/christmas-markets/krakow/lorem-ipsum,/uk/poland/christmas-markets/gdansk/lorem-ipsum
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-and-lighthouse
          path: |
            screenshots/
            lighthouse/
          retention-days: 14
